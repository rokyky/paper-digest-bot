# 搜广推论文日报机器人
#
# topic 配置
topic:
  name: "搜广推前沿论文速报"
  max_items: 1          # 每次推送论文数（每2小时推1篇）
  relevance_threshold: 0.70  # 相关性门槛（0-1），>0.7 才通过
  keywords:
    # ——— 最核心：LLM for Rec / 生成式推荐 ———
    - LLM for recommendation
    - generative recommendation
    - LLM for advertising
    - LLM for search
    - reasoning for recommendation
    # ——— 推荐系统核心 ———
    - recommender system
    - CTR prediction
    - CVR prediction
    - ranking
    - reranking
    - retrieval
    - candidate generation
    - learning to rank
    - two-tower
    - multi-task learning
    - multi-goal
    - user modeling
    - personalization
    - sequential recommendation
    - graph recommendation
    - feature interaction
    - cold start
    # ——— 广告/搜索 ———
    - advertising
    - sponsored search
    - auction
    - bidding
    - marketplace
    - feed ranking
    - search ranking
    - ad targeting
    # ——— 向量检索 / ANN ———
    - vector search
    - dense retrieval
    - ANN
    - semantic matching
    - embedding retrieval

# 学术源配置
sources:
  arxiv:
    enabled: true
    categories:
      - cs.IR
      - cs.LG
      - cs.AI
      - stat.ML
    lookback_hours: 72     # 抓取过去 N 小时内的论文（放宽窗口避免遗漏）
    max_results: 200
  semantic_scholar:
    enabled: false          # SSL 证书过期，暂时关闭
    seed_paper_ids:        # 以这些论文为种子找相似论文
      - "arXiv:2006.16366"  # DLRM
      - "arXiv:2205.13727"  # P5
      - "arXiv:1906.00091"  # DCN V2
    limit: 50
  openreview:
    enabled: true
    venues:
      - "ICLR.cc/2026/Conference"
      - "NeurIPS.cc/2025/Conference"
      - "ICML.cc/2025/Conference"
  engineering_blog:
    enabled: false          # 关掉工程博客，专注算法/模型类论文

  dblp:
    enabled: true
    max_results: 50
    venues:
      - "KDD 2025"
      - "KDD 2024"
      - "RecSys 2025"
      - "RecSys 2024"
      - "WWW 2025"
      - "WWW 2024"
      - "CIKM 2025"
      - "CIKM 2024"
      - "SIGIR 2025"
      - "SIGIR 2024"
      - "WSDM 2025"
      - "WSDM 2024"

# LLM 配置
llm:
  # 筛选模型（便宜，用于初筛 + 排序）
  filter:
    provider: "deepseek"     # openai / claude / deepseek / qwen
    model: "deepseek-chat"
    max_tokens: 500
    temperature: 0.1
    base_url: ""             # 非官方 API 填这里，如 "https://你的地址/v1"
  # 解读模型（强模型，用于深度解读）
  digest:
    provider: "deepseek"     # openai / claude / deepseek / qwen
    model: "deepseek-chat"
    max_tokens: 8192     # 输出上限（新格式 1500-2500 字中文 ~5000 tokens）
    temperature: 0.3
    base_url: ""             # 同上

# 推送配置
push:
  channel: "feishu"
  feishu:
    webhooks:
      - "${FEISHU_WEBHOOK}"       # 飞书机器人 webhook URL
    max_card_content_length: 6000 # 单卡片最大字符数（1500-2500字精读）

# 存储配置
storage:
  database: "data/papers.db"      # SQLite 数据库路径

# 调度配置
schedule:
  enabled: false                   # 默认不启用定时，手动触发
  time: "09:00"                    # 每天执行时间
