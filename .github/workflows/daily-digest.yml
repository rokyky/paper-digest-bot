# 搜广推日报 — GitHub Actions 定时任务
# 北京时间 8:00 collect 生成队列并 push 第 1 篇，10:00~22:00 每 2 小时继续 push 1 篇
#
# 首次使用前需要在 GitHub 仓库设置 Secrets：
# Settings → Secrets and variables → Actions → New repository secret
#   - FEISHU_WEBHOOK: 飞书群机器人 webhook URL
#   - DEEPSEEK_API_KEY: DeepSeek API Key

name: 搜广推日报

on:
  schedule:
    - cron: '0 0,2,4,6,8,10,12,14 * * *'
    # 北京时间 8:00 collect + push；10:00/12:00/14:00/16:00/18:00/20:00/22:00 push
  workflow_dispatch:
    inputs:
      mode:
        description: '运行模式'
        type: choice
        options: [auto, collect, push]
        default: auto
  repository_dispatch:
    types: [trigger-digest]

jobs:
  digest:
    runs-on: ubuntu-latest
    permissions:
      contents: write              # 允许提交 pushed_ids.json 回仓库
    env:
      TZ: Asia/Shanghai           # 使用北京时间

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 安装依赖
        run: |
          pip install -r requirements.txt

      - name: 配置环境变量（从 Secrets 读取）
        run: |
          echo "FEISHU_WEBHOOK=${{ secrets.FEISHU_WEBHOOK }}" >> $GITHUB_ENV
          echo "DEEPSEEK_API_KEY=${{ secrets.DEEPSEEK_API_KEY }}" >> $GITHUB_ENV

      - name: 运行日报 Pipeline
        run: |
          MODE="${{ inputs.mode || 'auto' }}"
          python main.py --mode "$MODE"
        timeout-minutes: 30

      # 将队列文件+去重记录提交回仓库（永久持久化）
      - name: 提交状态文件
        run: |
          git config user.name "PaperDigestBot"
          git config user.email "bot@paper-digest"
          git add pushed_ids.json digest_queue.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "无变更，跳过提交"
          else
            git commit -m "update state [skip ci]"
            git push || echo "注意：git push 失败，但 pipeline 已成功"
          fi
