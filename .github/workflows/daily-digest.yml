# 搜广推日报 — GitHub Actions 定时任务
# 每 2 小时推送 1 篇，北京时间 8:00~22:00
#
# 首次使用前需要在 GitHub 仓库设置 Secrets：
# Settings → Secrets and variables → Actions → New repository secret
#   - FEISHU_WEBHOOK: 飞书群机器人 webhook URL
#   - DEEPSEEK_API_KEY: DeepSeek API Key
#   - OPENAI_API_KEY: (可选) 如果用 OpenAI 代替 DeepSeek

name: 搜广推日报

on:
  schedule:
    - cron: '0 0,2,4,6,8,10,12,14 * * *'
    # 北京时间 8:00/10:00/12:00/14:00/16:00/18:00/20:00/22:00
  workflow_dispatch:           # 支持手动触发

jobs:
  digest:
    runs-on: ubuntu-latest
    # 同一小时内只跑一次，防止 2 小时窗口重叠
    concurrency:
      group: daily-digest-${{ github.schedule }}
      cancel-in-progress: false

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 恢复 SQLite 去重数据库（跨运行持久化）
        uses: actions/cache@v4
        with:
          path: data/
          key: paper-digest-db

      - name: 安装依赖
        run: |
          pip install -r requirements.txt

      - name: 配置环境变量（从 Secrets 读取）
        run: |
          echo "FEISHU_WEBHOOK=${{ secrets.FEISHU_WEBHOOK }}" >> $GITHUB_ENV
          echo "DEEPSEEK_API_KEY=${{ secrets.DEEPSEEK_API_KEY }}" >> $GITHUB_ENV
          echo "OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}" >> $GITHUB_ENV

      - name: 运行日报 Pipeline
        run: |
          python main.py
        timeout-minutes: 30
